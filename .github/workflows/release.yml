name: Release backend

on:
  push:
    branches: [main, feature-ci]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/sportshop-backend
  JAR_ARTIFACT: sportshop-backend-jar

jobs:
  setup:
    name: Setup & version
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature-ci'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      asset: ${{ steps.version.outputs.asset }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          # Per-branch monotonic counter: {branch}.1.0.{N} where N = max existing
          # tag on this branch + 1. Tags are created by the release job below, so
          # a failed run doesn't burn a number — next run reuses it.
          BRANCH="${{ github.ref_name }}"
          git fetch --tags --force --quiet
          LAST=$(git tag --list "${BRANCH}.1.0.*" \
            | awk -F. '{print $NF}' \
            | sort -n | tail -n1)
          NEXT=$(( ${LAST:-0} + 1 ))
          VERSION="${BRANCH}.1.0.${NEXT}"
          ASSET="sportshop-backend-${VERSION}.jar"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

  build:
    name: Build & upload jar
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build jar (no tests)
        run: mvn -B -ntp package -DskipTests

      - name: Stage jar for upload
        run: |
          set -euo pipefail
          # Spring Boot repackage drops the runnable jar in target/.
          # Exclude sources/javadoc jars in case someone wires them up later.
          shopt -s nullglob
          candidates=( target/sportshop-*.jar )
          JAR=""
          for f in "${candidates[@]}"; do
            case "$f" in
              *-sources.jar|*-javadoc.jar) continue ;;
              *) JAR="$f"; break ;;
            esac
          done
          if [ -z "$JAR" ]; then
            echo "::error::No runnable jar found in target/"
            exit 1
          fi
          cp "$JAR" "${{ needs.setup.outputs.asset }}"
          echo "Staged: ${{ needs.setup.outputs.asset }}"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.JAR_ARTIFACT }}
          path: ${{ needs.setup.outputs.asset }}
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Build image & push to GHCR
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.JAR_ARTIFACT }}
          # Land the versioned jar in target/ so Dockerfile's default
          # JAR_FILE=target/sportshop-*.jar glob picks it up.
          path: target/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE_REPO}:${{ needs.setup.outputs.version }}" \
            -t "${IMAGE_REPO}:${{ github.ref_name }}-latest" \
            .

      - name: Push versioned + per-branch latest
        run: |
          set -euo pipefail
          VERSION="${{ needs.setup.outputs.version }}"
          # Per-branch floating tag (e.g. main-latest, feature-ci-latest).
          # Avoids a single :latest that would jump between branches.
          BRANCH_LATEST="${{ github.ref_name }}-latest"
          docker push "${IMAGE_REPO}:${VERSION}"
          docker push "${IMAGE_REPO}:${BRANCH_LATEST}"

  release:
    name: Finalize release
    needs: [setup, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.JAR_ARTIFACT }}

      - name: Create GitHub Release with jar (tags the commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.setup.outputs.version }}"
          ASSET="${{ needs.setup.outputs.asset }}"
          # Tag name = version exactly (no `v` prefix). Same convention as sportshop-swagger.
          gh release create "$VERSION" "$ASSET" \
            --title "sportshop-backend $VERSION" \
            --target "${{ github.sha }}" \
            --generate-notes

      - name: Job summary
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          BRANCH_LATEST="${{ github.ref_name }}-latest"
          REPO="${{ github.repository }}"
          {
            echo "## Released sportshop-backend ${VERSION}"
            echo ""
            echo "**Tag:** \`${VERSION}\` on commit \`${{ github.sha }}\`"
            echo ""
            echo "**Docker image:**"
            echo ""
            echo "\`\`\`"
            echo "${IMAGE_REPO}:${VERSION}"
            echo "${IMAGE_REPO}:${BRANCH_LATEST}"
            echo "\`\`\`"
            echo ""
            echo "**Pull anonymously:**"
            echo ""
            echo "\`\`\`"
            echo "docker pull ${IMAGE_REPO}:${VERSION}"
            echo "\`\`\`"
            echo ""
            echo "**Jar:** [Release page](https://github.com/${REPO}/releases/tag/${VERSION})"
          } >> "$GITHUB_STEP_SUMMARY"
