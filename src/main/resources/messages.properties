# User-facing error copy. Resolved via MessageSource in GlobalExceptionHandler.
# MessageFormat: {0}/{1} for args; literal apostrophe must be doubled ('').

# ---- HTTP-level ----
http.badRequest.default=The request is invalid.
http.badRequest.typeMismatch=Invalid value ''{0}'' for parameter ''{1}''.
http.badRequest.missingParam=Required parameter ''{0}'' is missing.
http.badRequest.malformedBody=Malformed request body.
http.badRequest.validationFailed=Request body validation failed.
http.badRequest.constraintFailed=Request parameters failed validation.
http.unauthorized=Authentication is required.
http.forbidden=You do not have permission to perform this action.
http.notFound.default=Resource not found.
http.conflict.default=The request conflicts with the current state.
http.methodNotAllowed=Method ''{0}'' is not supported for this endpoint.
http.mediaType.unsupported=Content type ''{0}'' is not supported for this endpoint.
http.mediaType.missing=Request Content-Type is required.
http.payloadTooLarge.default=The request payload is too large.
http.payloadTooLarge.upload=Uploaded file exceeds the maximum allowed size.
http.badGateway.default=An upstream service is currently unavailable.
http.internalError=An unexpected error occurred.

