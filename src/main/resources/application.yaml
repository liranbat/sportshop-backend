spring:
  application:
    name: sportshop

  servlet:
    multipart:
      enabled: true
      max-file-size: 12MB
      max-request-size: 12MB

  datasource:
    url: jdbc:postgresql://${SPORTSHOP_DB_HOST:localhost}:${SPORTSHOP_DB_PORT:5432}/${SPORTSHOP_DB_NAME:sportshop}?currentSchema=${SPORTSHOP_DB_SCHEMA:sportshop}
    username: ${SPORTSHOP_DB_USER:sportshop_app}
    password: ${SPORTSHOP_DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${SPORTSHOP_DB_SCHEMA:sportshop}
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    schemas: ${SPORTSHOP_DB_SCHEMA:sportshop}
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  tracing:
    sampling:
      probability: 1.0

app:
  api:
    path-prefix: /api
  cors:
    allowed-origins: ${SPORTSHOP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  images:
    url-prefix: images
    category-prefix: categories
    product-prefix: products
    local-dir: ${SPORTSHOP_IMAGES_LOCAL_DIR:../../images}
    cache-ttl-seconds: ${SPORTSHOP_IMAGES_CACHE_TTL_SECONDS:604800}
  auth:
    secret: ${SPORTSHOP_JWT_SECRET}
    access-token-ttl: ${SPORTSHOP_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${SPORTSHOP_REFRESH_TOKEN_TTL:P14D}
    cookie-secure: ${SPORTSHOP_AUTH_COOKIE_SECURE:false}
