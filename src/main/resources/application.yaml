spring:
  application:
    name: sportshop

  datasource:
    url: jdbc:postgresql://${SPORTSHOP_DB_HOST:localhost}:${SPORTSHOP_DB_PORT:5432}/${SPORTSHOP_DB_NAME:sportshop}?currentSchema=${SPORTSHOP_DB_SCHEMA:sportshop}
    username: ${SPORTSHOP_DB_USER:sportshop_app}
    password: ${SPORTSHOP_DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${SPORTSHOP_DB_SCHEMA:sportshop}
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    schemas: ${SPORTSHOP_DB_SCHEMA:sportshop}
    locations: classpath:db/migration
    baseline-on-migrate: false

app:
  cors:
    allowed-origins: ${SPORTSHOP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  images:
    url-prefix: images
    category-prefix: categories
    product-prefix: products
    local-dir: ${SPORTSHOP_IMAGES_LOCAL_DIR:../../images}
